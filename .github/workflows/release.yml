name: Publish downloadable firmware bundle

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v0.3.0"
      publish:
        description: "Publish after verifying the prepared draft"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Select tested unified build for this exact source commit
        id: builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          tip = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          runs = api('actions/workflows/build.yml/runs?status=success&per_page=30')['workflow_runs']
          allowed = {'README.md','CHANGES.md','.github/release-notes.md','.github/workflows/release.yml'}
          selected = None
          for run in runs:
              firmware_sha = run['head_sha']
              ancestor = subprocess.run(['git','merge-base','--is-ancestor',firmware_sha,tip],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if ancestor.returncode:
                  continue
              changed = set(subprocess.check_output(['git','diff','--name-only',firmware_sha,tip]).decode().splitlines())
              if not changed <= allowed:
                  continue
              assets = api('actions/runs/'+str(run['id'])+'/artifacts')['artifacts']
              if len(assets) == 1 and assets[0]['name'] == 'moNa2-bundle.zip' and not assets[0]['expired']:
                  selected = (run,firmware_sha)
                  break
          if selected is None:
              raise SystemExit('Build this firmware source before publishing; only documentation-only refreshes may reuse a build')
          run, firmware_sha = selected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={run['id']}\nsha={tip}\nfirmware_sha={firmware_sha}\n")
          PYCODE

      - name: Download tested unified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moNa2-bundle.zip
          run-id: ${{ steps.builds.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware
          skip-decompress: true

      - name: Refresh reviewed documentation and verify unchanged firmware
        env:
          SOURCE_SHA: ${{ steps.builds.outputs.sha }}
          FIRMWARE_SHA: ${{ steps.builds.outputs.firmware_sha }}
          BUILD_RUN: ${{ steps.builds.outputs.run }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from package_distribution import verify_archive, sha
          path = Path('firmware/moNa2-bundle.zip')
          original = verify_archive(path)
          assert original['commit'] == os.environ['FIRMWARE_SHA']
          assert original['source'] == 'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/tree/'+os.environ['FIRMWARE_SHA']
          with zipfile.ZipFile(path) as z:
              payload = {n.removeprefix('moNa2/'):z.read(n) for n in z.namelist() if not n.endswith('SHA256SUMS')}
          binaries = {n:payload[n] for n in original['firmware']}
          for name in ['README.md','CHANGES.md']:
              payload[name] = Path(name).read_bytes()
          bundle = dict(original)
          bundle.update(commit=os.environ['SOURCE_SHA'], source='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/tree/'+os.environ['SOURCE_SHA'], firmware_commit=os.environ['FIRMWARE_SHA'], firmware_build_run=int(os.environ['BUILD_RUN']), documentation_commit=os.environ['SOURCE_SHA'])
          payload['BUNDLE.json'] = (json.dumps(bundle,ensure_ascii=False,indent=2)+'\n').encode()
          payload['SHA256SUMS'] = ''.join(f'{sha(data)}  {name}\n' for name,data in sorted(payload.items())).encode()
          with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,data in sorted(payload.items()):
                  info = zipfile.ZipInfo('moNa2/'+name,date_time=(2026,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info,data)
          verified = verify_archive(path)
          assert verified['commit'] == os.environ['SOURCE_SHA']
          with zipfile.ZipFile(path) as z:
              for name,data in binaries.items():
                  assert z.read('moNa2/'+name) == data
              for name in ['README.md','CHANGES.md']:
                  assert z.read('moNa2/'+name) == Path(name).read_bytes()
          print('Reviewed documents refreshed; both tested UF2 files unchanged: '+sha(path.read_bytes()))
          PYCODE

      - name: Prepare complete draft and optionally publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_COMMIT: ${{ steps.builds.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag)
          asset = Path('firmware/moNa2-bundle.zip')
          fields = 'assets,isDraft,targetCommitish,url'
          existing = subprocess.run(['gh','release','view',tag,'--json',fields],capture_output=True,text=True)
          if existing.returncode:
              subprocess.run(['gh','release','create',tag,str(asset),'--target',os.environ['RELEASE_COMMIT'],'--draft','--title','moNa2 統合版 '+tag,'--notes-file','.github/release-notes.md'],check=True)
              data = json.loads(subprocess.check_output(['gh','release','view',tag,'--json',fields]))
          else:
              data = json.loads(existing.stdout)
              assert data['isDraft']
              assert {a['name'] for a in data['assets']} <= {asset.name}
              subprocess.run(['gh','release','edit',tag,'--target',os.environ['RELEASE_COMMIT'],'--title','moNa2 統合版 '+tag,'--notes-file','.github/release-notes.md'],check=True)
              subprocess.run(['gh','release','upload',tag,str(asset),'--clobber'],check=True)
              data = json.loads(subprocess.check_output(['gh','release','view',tag,'--json',fields]))
          assert data['isDraft'] and data['targetCommitish'] == os.environ['RELEASE_COMMIT']
          assert len(data['assets']) == 1
          attached = data['assets'][0]
          assert attached['name'] == asset.name and attached['size'] == asset.stat().st_size
          # Reuse a draft only if its attached bytes match the tested bundle.
          review = Path(os.environ['RUNNER_TEMP'])/'draft-review'
          review.mkdir()
          subprocess.run(['gh','release','download',tag,'--pattern',asset.name,'--dir',str(review)],check=True)
          assert hashlib.sha256((review/asset.name).read_bytes()).digest() == hashlib.sha256(asset.read_bytes()).digest()
          print(data['url'])
          if os.environ['PUBLISH'].lower() != 'true':
              raise SystemExit(0)
          # Fast-forward only: a concurrent incompatible main update must fail.
          subprocess.run(['git','fetch','origin','main'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','origin/main',os.environ['RELEASE_COMMIT']],check=True)
          subprocess.run(['git','push','origin',os.environ['RELEASE_COMMIT']+':refs/heads/main'],check=True)
          subprocess.run(['gh','release','edit',tag,'--draft=false','--latest'],check=True)
          PYCODE
