name: Publish downloadable firmware bundle

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v0.3.0"
      publish:
        description: "Publish after verifying the prepared draft"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Select tested unified build for this exact source commit
        id: builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          tip = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          runs = api('actions/workflows/build.yml/runs?status=success&per_page=30')['workflow_runs']
          matched = [r for r in runs if r['head_sha'] == tip]
          if not matched:
              raise SystemExit('Build this exact source commit before publishing')
          run = matched[0]
          assets = api('actions/runs/'+str(run['id'])+'/artifacts')['artifacts']
          assert len(assets) == 1 and assets[0]['name'] == 'moNa2-bundle.zip' and not assets[0]['expired']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run={run['id']}\nsha={tip}\n")
          PYCODE

      - name: Download tested unified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moNa2-bundle.zip
          run-id: ${{ steps.builds.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware
          skip-decompress: true

      - name: Verify complete bundle and source commit
        env:
          SOURCE_SHA: ${{ steps.builds.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from package_distribution import verify_archive
          bundle = verify_archive(Path('firmware/moNa2-bundle.zip'))
          assert bundle['commit'] == os.environ['SOURCE_SHA']
          assert bundle['source'] == 'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/tree/'+os.environ['SOURCE_SHA']
          PYCODE

      - name: Prepare complete draft and optionally publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_COMMIT: ${{ steps.builds.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag)
          asset = Path('firmware/moNa2-bundle.zip')
          fields = 'assets,isDraft,targetCommitish,url'
          existing = subprocess.run(['gh','release','view',tag,'--json',fields],capture_output=True,text=True)
          if existing.returncode:
              subprocess.run(['gh','release','create',tag,str(asset),'--target',os.environ['RELEASE_COMMIT'],'--draft','--title','moNa2 統合版 '+tag,'--notes-file','.github/release-notes.md'],check=True)
              data = json.loads(subprocess.check_output(['gh','release','view',tag,'--json',fields]))
          else:
              data = json.loads(existing.stdout)
          assert data['isDraft'] and data['targetCommitish'] == os.environ['RELEASE_COMMIT']
          assert len(data['assets']) == 1
          attached = data['assets'][0]
          assert attached['name'] == asset.name and attached['size'] == asset.stat().st_size
          # Reuse a draft only if its attached bytes match the tested bundle.
          review = Path(os.environ['RUNNER_TEMP'])/'draft-review'
          review.mkdir()
          subprocess.run(['gh','release','download',tag,'--pattern',asset.name,'--dir',str(review)],check=True)
          assert hashlib.sha256((review/asset.name).read_bytes()).digest() == hashlib.sha256(asset.read_bytes()).digest()
          print(data['url'])
          if os.environ['PUBLISH'].lower() != 'true':
              raise SystemExit(0)
          # Fast-forward only: a concurrent incompatible main update must fail.
          subprocess.run(['git','fetch','origin','main'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','origin/main',os.environ['RELEASE_COMMIT']],check=True)
          subprocess.run(['git','push','origin',os.environ['RELEASE_COMMIT']+':refs/heads/main'],check=True)
          subprocess.run(['gh','release','edit',tag,'--draft=false','--latest'],check=True)
          PYCODE
