name: Publish downloadable firmware bundles

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select successful builds for both current branch tips
        id: builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          output = []
          for branch, key in [('main','stock'), ('COROPIT','coropit')]:
              tip = api('commits/'+branch)['sha']
              runs = api('actions/workflows/build.yml/runs?branch='+branch+'&status=success&per_page=10')['workflow_runs']
              matched = [r for r in runs if r['head_sha'] == tip]
              if not matched:
                  raise SystemExit('Build the latest '+branch+' commit successfully before publishing')
              output += [f'{key}_run={matched[0]["id"]}', f'{key}_sha={tip}']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('\n'.join(output)+'\n')
          PY

      - name: Download tested stock bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moNa2-stock-bundle.zip
          run-id: ${{ steps.builds.outputs.stock_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware
          skip-decompress: true

      - name: Download tested COROPIT bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moNa2-COROPIT-bundle.zip
          run-id: ${{ steps.builds.outputs.coropit_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: firmware
          skip-decompress: true

      - name: Verify both bundles and their source commits
        env:
          STOCK_SHA: ${{ steps.builds.outputs.stock_sha }}
          COROPIT_SHA: ${{ steps.builds.outputs.coropit_sha }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from package_distribution import verify_archive
          for variant, sha in [('stock',os.environ['STOCK_SHA']),('COROPIT',os.environ['COROPIT_SHA'])]:
              path = Path('firmware') / ('moNa2-'+variant+'-bundle.zip')
              bundle = verify_archive(path)
              assert bundle['variant'] == variant and bundle['commit'] == sha
              assert bundle['source'] == 'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/tree/'+sha
          PY

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.builds.outputs.stock_sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = '''## ダウンロード

          - 純正トラックボール：moNa2-stock-bundle.zip
          - COROPIT：moNa2-COROPIT-bundle.zip

          各ZIPに左右UF2、使い方、著作権・ライセンス表示、チェックサムを同梱しています。
          ZIP全体を取得・展開してください。Centralが右、Peripheralが左です。
          詳しい設定方法はリポジトリ先頭の説明をご覧ください。

          GT1・GT2・GT3とSTに対応。初期配列は標準、TD・マクロ・コンボは空です。
          保存済みVial設定は初期値より優先されます。
          '''
          (Path(os.environ['RUNNER_TEMP'])/'release-notes.md').write_text(notes)
          PY
          gh release create "$TAG_NAME" \
            firmware/moNa2-stock-bundle.zip firmware/moNa2-COROPIT-bundle.zip \
            --target "$RELEASE_COMMIT" --draft \
            --title "GT1–GT3 / ST 配布版 $TAG_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['gh','release','view',os.environ['TAG_NAME'],'--json','assets']))
          assert {a['name'] for a in data['assets']} == {'moNa2-stock-bundle.zip','moNa2-COROPIT-bundle.zip'}
          PY
          gh release edit "$TAG_NAME" --draft=false --latest
